server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El HTML/JS/CSS nunca se cachea por horas - así Cloudflare/el navegador
    # siempre revalida contra el origen en vez de servir una versión vieja
    # hasta por 4h después de un deploy (bug real: eso rompió el botón
    # "Continuar" porque algunos nodos de Cloudflare sirvieron un app.js
    # viejo que todavía referenciaba un elemento ya eliminado del HTML).
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Las imagenes de marca casi no cambian, esas si se pueden cachear largo.
    location ~* \.(?:png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
